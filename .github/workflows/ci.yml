name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # The lockfile first, so the tests run on the versions the Docker image ships.
      - run: pip install -r requirements.lock && pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest tests
      - name: Migrations match the models
        run: |
          export DATABASE_URL=sqlite:///ci.db
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [20, 22, 24]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build, and check Next still runs proxy.ts (the Host check)
        shell: bash  # pipefail: a failed build must fail the step, not just tee
        run: npm run build | tee build.log && grep -q "Proxy (Middleware)" build.log
