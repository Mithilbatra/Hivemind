# Hivemind: everything needed to run locally: `make up` (or `docker compose up --build`).
x-backend: &backend
  build: ./backend
  env_file: .env
  environment: &backend-env
    # Built here from REDIS_PASSWORD, so it always matches the password Redis is started with
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (make setup adds one)}@redis:6379/0
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  restart: unless-stopped
  volumes:
    - ${REPOS_DIR:-./samples/repos}:/repos
    - orch-data:/data
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orchestrator}
      POSTGRES_DB: orchestrator
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # A password, because agent code runs next to the worker and can reach this port, and RQ jobs are pickles:
    # whoever can write to Redis can run code in the worker.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (make setup adds one)}"]
    environment: { REDISCLI_AUTH: "${REDIS_PASSWORD}" }
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]  # without the password the answer is NOAUTH, exit 0 too
      interval: 3s
      retries: 20

  api:
    <<: *backend
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]  # localhost only: this API can run code in your repos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 5s
      retries: 30

  worker:
    <<: *backend
    # Agent and check processes run as the worker's user. The worker gets none of the secrets it does not use, and
    # `python -m app.worker` makes its processes non-dumpable, so /proc/<pid>/environ is closed to those children.
    environment:
      <<: *backend-env
      SECRET_KEY: ""
      ADMIN_USERNAME: ""
      ADMIN_PASSWORD: ""
      POSTGRES_PASSWORD: ""
      REDIS_PASSWORD: ""
    # No shell and no URL on the command line: rq runs inside the python process, which gets SIGTERM directly
    command: ["python", "-m", "app.worker", "-n", "${WORKER_CONCURRENCY:-4}"]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-47213}:3000"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  orch-data:
